[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poma-memory"
version = "0.3.8"
description = "Persistent context for AI coding agents. No cloud. Just markdown."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "POMA AI GmbH, Berlin", email = "sdk@poma-ai.com" }]
keywords = ["poma", "memory", "rag", "agentic", "markdown", "claude-code", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]

dependencies = [
    "poma-primecut-nano>=0.1.0,<1",
    "tiktoken>=0.11,<1",
    "bm25s>=0.3,<1",
    "numpy>=2.2,<3",
]

[project.optional-dependencies]
semantic = ["model2vec>=0.7,<1"]
openai = ["openai>=1.109,<2"]
mcp = ["mcp>=1.26,<2"]
dev = ["pytest>=7.0", "pytest-mock"]

[project.scripts]
poma-memory = "poma_memory.cli:main"
poma-memory-mcp = "poma_memory.mcp_server:main"

[project.urls]
Homepage = "https://github.com/poma-ai/poma-memory"
Documentation = "https://github.com/poma-ai/poma-memory#readme"

[tool.setuptools.packages.find]
include = ["poma_memory*"]
